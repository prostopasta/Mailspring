# Unsigned Windows installer for a fork's personal branches. build-windows.yaml
# needs Foundry 376's Azure signing and S3 secrets, which a fork doesn't have.
# workflow_dispatch only works for workflows on the default branch, so pushing
# a personal/** branch is what starts this one. The installer is unsigned, so
# SmartScreen warns on a browser-downloaded copy ("More info" → "Run anyway").
name: Build for Windows (personal, unsigned)

on:
  push:
    branches: ['personal/**']
  workflow_dispatch:

jobs:
  build:
    if: github.repository != 'Foundry376/Mailspring'
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Cache NodeJS modules
        uses: actions/cache@v6
        with:
          path: |
            ./node_modules
            ./app/node_modules
          key: windows-2022-deps-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/package-lock.json') }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Create Windows Installer
        run: node app/build/create-signed-windows-installer.js

      # A release rather than an artifact: the installer is ~200 MB and the
      # account's artifact storage quota is 0.5 GB. Release assets don't count.
      - name: Publish Installer as a Pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="personal-$(git rev-parse --short=8 HEAD)"
          gh release create "$tag" app/dist/MailspringSetup.exe \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Personal Windows build $tag (unsigned)" \
            --notes "Unsigned build of ${GITHUB_REF_NAME} at ${GITHUB_SHA}. Automatic update checks are off by default."
